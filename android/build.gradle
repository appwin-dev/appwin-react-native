buildscript {
  repositories {
    google()
    mavenCentral()
  }
  dependencies {
    classpath "com.android.tools.build:gradle:8.7.3"
    classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:2.1.0"
    classpath "org.jetbrains.kotlin:compose-compiler-gradle-plugin:2.1.0"
  }
}

apply plugin: "com.android.library"
apply plugin: "org.jetbrains.kotlin.android"
apply plugin: "org.jetbrains.kotlin.plugin.compose"

android {
  namespace "io.appwin.reactnative"
  compileSdk 35

  defaultConfig {
    minSdk 24
  }

  compileOptions {
    sourceCompatibility JavaVersion.VERSION_17
    targetCompatibility JavaVersion.VERSION_17
  }

  kotlinOptions {
    jvmTarget = "17"
  }

  buildFeatures {
    compose true
  }

  sourceSets {
    main {
      java.srcDirs = ["src/main/java"]
    }
  }
}

repositories {
  // Prefer mavenLocal so a same-version republish is visible. Maven Central
  // also hosts `io.appwin:*:0.9.2`; without mavenLocal first (and a purge of
  // the Gradle module cache) RN ships a stale Community UI.
  mavenLocal()
  google()
  mavenCentral()
}

dependencies {
  // Supplied by the host app: React Native resolves its own version, and
  // pinning it here would conflict on every version bump on the app side.
  implementation "com.facebook.react:react-android"

  // `*-local` so Maven Central's same-version `0.9.2` cannot shadow a fresh
  // `publishToMavenLocal` (that was shipping a stale Community reaction UI).
  // Publish with: `./gradlew publishToMavenLocal -PappwinSdkVersion=0.9.3-local`
  implementation "io.appwin:appwin-core:0.15.0"
  implementation "io.appwin:appwin-support:0.15.0"
  implementation "io.appwin:appwin-community:0.15.0"
  implementation "io.appwin:appwin-notifications:0.15.0"
  implementation "io.appwin:appwin-analytics:0.15.0"
  implementation "io.appwin:appwin-attribution:0.15.0"

  implementation platform("androidx.compose:compose-bom:2024.12.01")
  implementation "androidx.compose.ui:ui"
  implementation "androidx.compose.material3:material3"
}
